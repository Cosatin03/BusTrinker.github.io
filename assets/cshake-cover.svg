<g transform="translate(600 98)">
<text x="0" y="0" fill="#081021" stroke="#061126" stroke-width="24" stroke-linejoin="round" font-family="Arial Black,Arial,sans-serif" font-size="121" font-style="italic" font-weight="900" text-anchor="middle" paint-order="stroke">C-SHAKE</text>
<text x="0" y="0" fill="url(#lime)" stroke="#fc30af" stroke-width="4" stroke-linejoin="round" font-family="Arial Black,Arial,sans-serif" font-size="121" font-style="italic" font-weight="900" text-anchor="middle" paint-order="stroke">C-SHAKE</text>
</g>
<text x="600" y="568" text-anchor="middle" fill="#e5f9ff" letter-spacing="6" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="21">PARTY BATTLE · LIVE</text>
</svg>