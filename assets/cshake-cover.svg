<rect x="976" y="71" width="15" height="15" fill="#ff3ca3" transform="rotate(28 983 78)"/>
<rect x="91" y="348" width="12" height="24" fill="#21cbff" transform="rotate(19 97 360)"/>
<rect x="1085" y="473" width="16" height="16" fill="#a9ff28"/>
