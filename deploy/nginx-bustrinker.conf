# Install as /etc/nginx/sites-available/bustrinker
server {
    listen 80;
    listen [::]:80;
    server_name bustrinker.de www.bustrinker.de;

    root /var/www/bustrinker/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:key|pem|env|log|sqlite|db)$ {
        deny all;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
