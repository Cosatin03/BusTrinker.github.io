<path d="M931 580Q933 388 1056 386Q1174 391 1193 580" fill="#0e2141" stroke="#ef32b8" stroke-width="9"/>
</g>
<!-- Phone-shaking hands on sides -->
<g transform="translate(258 346) rotate(-19)">
<rect x="-53" y="-86" width="91" height="167" rx="18" fill="#081125" stroke="#22dfff" stroke-width="9" filter="url(#glow)"/>
