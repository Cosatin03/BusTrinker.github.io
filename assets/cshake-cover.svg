<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">C-Shake Party Battle</title>
<desc id="desc">Neon-Spielcover mit C-Shake-Schriftzug, drei schüttelnden Handys, Hoch- und Runterpfeilen sowie einer Punktzahl.</desc>
<defs>
<radialGradient id="bg"><stop stop-color="#173769"/><stop offset=".58" stop-color="#101633"/><stop offset="1" stop-color="#060a19"/></radialGradient>
<linearGradient id="phone" x2="1" y2="1"><stop stop-color="#20ddff"/><stop offset=".48" stop-color="#aa2dff"/><stop offset="1" stop-color="#f92cb2"/></linearGradient>
<linearGradient id="lime" x2="0" y2="1"><stop stop-color="#c4ff34"/><stop offset="1" stop-color="#3df363"/></linearGradient>
<linearGradient id="screen" x2="0" y2="1"><stop stop-color="#162c47"/><stop offset="1" stop-color="#080d21"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="13" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1200" height="600" fill="url(#bg)"/>
<ellipse cx="600" cy="465" rx="490" ry="100" fill="#7620e9" opacity=".35" filter="url(#soft)"/>
<ellipse cx="890" cy="250" rx="240" ry="160" fill="#009ef5" opacity=".22" filter="url(#soft)"/>
<g opacity=".75" fill="none" stroke-width="8" stroke-linecap="round">
<path d="M18 475 240 310M60 570 252 405M955 328 1184 174M955 436 1158 316" stroke="#ff2bc7"/>
<path d="M34 210 257 326M1010 174 1178 45" stroke="#17dafe"/>
</g>
<g opacity=".85">
